  :root{
    --bg:#CDCDCD;
    --panel:#D7D7D7;
    --surface:#E6E6E6;
    --line:rgba(0,0,0,.09);
    --ink:#000000;
    --ink-30:rgba(0,0,0,.30);
    --ink-12:rgba(0,0,0,.12);
    --ink-20:rgba(0,0,0,.20);
    --accent:#FF2F00;
    --teal-fill:#45CAC4;
    --teal-ink:#1B4E54;
    --fill:radial-gradient(135% 130% at 26% 20%, #FF1500 0%, #F95001 100%);
    --fill-lin:linear-gradient(95deg,#FF1500,#F95001);
    --contour:linear-gradient(30deg,#FFFFFF 0%,#D7D7D7 27%,#D7D7D7 55%,#FFFFFF 100%);
    --font:'Golos',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--font);font-weight:500;line-height:1.42;
    text-transform:lowercase;
    -webkit-font-smoothing:antialiased;
    padding:clamp(20px,4vw,56px);
  }
  b,strong{font-weight:700}
  .wrap{max-width:1080px;margin:0 auto}

  /* header */
  .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--ink-30);font-weight:500}
  .title{font-weight:700;font-size:clamp(48px,13vw,128px);line-height:1;letter-spacing:-.035em;margin:6px 0 0}
  .title em{font-style:normal;background:linear-gradient(180deg,#F95001 0%,#FF1500 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .head-row{display:flex;align-items:flex-end;align-items:last baseline;gap:30px;flex-wrap:wrap}
  .meta{text-align:left;font-weight:700;line-height:1.28;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
  .meta div{color:var(--ink-30)}
  .meta .hl{color:var(--teal-ink)}

  /* progress */
  .spine{margin:30px 0 34px}
  .spine-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:11px}
  .spine-label{font-size:14px;color:var(--ink-30)}
  .spine-label b{color:var(--ink)}
  .spine-pct{font-weight:700;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em;line-height:1}
  .spine-pct span{font-size:.46em;color:var(--ink-30);font-weight:700}
  .rail{position:relative;height:5px;border-radius:99px;background:var(--ink-12)}
  .rail-fill{position:absolute;inset:0 auto 0 0;height:100%;border-radius:99px;background:var(--fill-lin);width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .rail-knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--bg);transform:translate(-50%,-50%);left:0;transition:left 1.1s cubic-bezier(.22,1,.36,1)}

  /* calendar frame w/ gradient contour */
  .cal-frame{background:var(--contour);padding:1.5px;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.14),0 1px 0 rgba(255,255,255,.55)}
  .cal{background:var(--panel);border-radius:18.5px;overflow:hidden}
  .dow{display:grid;grid-template-columns:62px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .dow span{padding:12px 12px;font-size:12px;letter-spacing:.02em;color:var(--ink-30);font-weight:500}
  .dow span:first-child{color:transparent}
  .dow span.we{color:var(--ink-20)}

  .week{display:grid;grid-template-columns:62px repeat(7,1fr);border-top:1px solid var(--line)}
  .week:first-child{border-top:none}
  .wk-rail{padding:13px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);background:rgba(255,255,255,.22)}
  .wk-num{font-weight:700;font-size:19px;color:var(--ink-20);letter-spacing:-.02em}
  .wk-range{font-size:10px;color:var(--ink-20);line-height:1.3;font-weight:500}

  .day{min-height:98px;padding:9px 9px 11px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;position:relative}
  .day:last-child{border-right:none}
  .day.out{background:rgba(0,0,0,.045)}
  .daynum{font-size:13px;color:var(--ink-30);font-weight:500;display:flex;align-items:center;gap:6px}
  .day.out .daynum{color:var(--ink-20)}
  .day.today{background:rgba(255,47,0,.07);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .day.today .daynum b{background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-weight:700}
  .today-tag{font-size:10px;letter-spacing:.02em;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px;font-weight:500}

  .chip{border-radius:10px;padding:7px 9px;position:relative;overflow:hidden;display:block;transition:transform .15s ease,box-shadow .15s ease}
  .chip:hover{transform:translateY(-1px)}
  .chip.lesson{background:var(--fill);box-shadow:0 4px 14px rgba(255,47,0,.26)}
  .chip.lesson .chip-type{color:rgba(255,255,255,.82)}
  .chip.lesson .chip-title{color:#fff}
  .chip.lesson .note{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.85)}
  .chip.feedback,.chip.finish{background:var(--surface);border:1px solid rgba(0,0,0,.06)}
  .chip.feedback::before,.chip.finish::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal-fill)}
  .chip.finish::before{background:var(--accent)}
  .chip.finish .chip-title{color:var(--accent)}
  .chip-type{font-size:10px;letter-spacing:.02em;font-weight:500;color:var(--teal-ink);display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap}
  .chip-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--ink)}
  .lv{display:inline-flex;align-items:center;gap:4px;color:var(--teal-ink)}
  .lv::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal-fill);animation:pulse 1.8s infinite}
  .note{border:1px solid var(--ink-20);color:var(--ink-30);border-radius:4px;padding:0 4px;font-size:9px;font-weight:500}
  .chip.done{opacity:.42}

  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(69,202,196,.5)}50%{opacity:.55;box-shadow:0 0 0 4px rgba(69,202,196,0)}}

  /* agenda (mobile) */
  .agenda{display:none}
  .ag-week{margin-top:22px}.ag-week:first-child{margin-top:0}
  .ag-whead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .ag-whead .n{font-weight:700;font-size:16px;color:var(--ink-20)}
  .ag-whead .r{font-size:11px;color:var(--ink-20);font-weight:500}
  .ag-item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:13px;margin-bottom:8px;position:relative;overflow:hidden}
  .ag-item.lesson{background:var(--fill);box-shadow:0 4px 14px rgba(255,47,0,.22)}
  .ag-item.feedback,.ag-item.finish{background:var(--surface);border:1px solid rgba(0,0,0,.06)}
  .ag-item.feedback::before,.ag-item.finish::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal-fill)}
  .ag-item.finish::before{background:var(--accent)}
  .ag-item.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .ag-date{font-size:12px;color:var(--ink-30);min-width:62px;line-height:1.35;padding-top:2px;font-weight:500}
  .ag-date b{color:var(--ink);font-weight:700;display:block;font-size:14px}
  .ag-item.lesson .ag-date,.ag-item.lesson .ag-date b{color:rgba(255,255,255,.85)}
  .ag-item.lesson .ag-date b{color:#fff}
  .ag-body .t{font-weight:700;font-size:16px}
  .ag-item.lesson .ag-body .t{color:#fff}
  .ag-item.finish .ag-body .t{color:var(--accent)}
  .ag-body .ty{font-size:10px;color:var(--teal-ink);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:500}
  .ag-item.lesson .ag-body .ty{color:rgba(255,255,255,.82)}
  .ag-item.lesson .note{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.85)}
  .ag-empty{display:flex;gap:10px;align-items:center;padding:6px 14px;border-radius:9px;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--ink-30)}
  .ag-empty .d{min-width:62px;font-weight:700}
  .ag-empty .w{color:var(--ink-20)}
  .ag-empty.done{opacity:.5}
  .ag-empty.today{background:rgba(255,47,0,.06);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
  .ag-empty .today-tag{margin-left:auto}

  /* footer */
  .foot{margin-top:22px;font-size:12px;color:var(--ink-30);display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-weight:500}
  .foot .m{color:var(--teal-fill)}

  @media (max-width:760px){
    .cal-frame,.dow{display:none}
    .agenda{display:block}
  }
  @media (max-width:600px){
    .head-row{flex-direction:column;align-items:flex-start;gap:10px}
    .meta{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">расписание · поток июнь 2026</div>
    <div class="head-row">
      <h1 class="title"><em>ai</em> upgrade</h1>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <div class="spine">
    <div class="spine-head">
      <div class="spine-label" id="spineLabel"></div>
      <div class="spine-pct" id="spinePct">0<span>%</span></div>
    </div>
    <div class="rail"><div class="rail-fill" id="railFill"></div><div class="rail-knob" id="railKnob"></div></div>
  </div>

  <div class="cal-frame"><div class="cal" id="cal"></div></div>
  <div class="agenda" id="agenda"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
// ====== данные курса — правь даты здесь ======
const EVENTS = [
  { date:'2026-06-11', type:'lesson',   title:'урок 0' },
  { date:'2026-06-12', type:'lesson',   title:'урок 1' },
  { date:'2026-06-17', type:'feedback', title:'фидбек 1' },
  { date:'2026-06-19', type:'lesson',   title:'урок 2' },
  { date:'2026-06-25', type:'lesson',   title:'урок 3' },
  { date:'2026-06-26', type:'feedback', title:'фидбек 2', note:'продлён' },
  { date:'2026-07-01', type:'feedback', title:'фидбек 3', online:true },
  { date:'2026-07-02', type:'lesson',   title:'урок 4' },
  { date:'2026-07-08', type:'feedback', title:'фидбек 4', online:true },
  { date:'2026-07-09', type:'lesson',   title:'урок 5', note:'доп.' },
  { date:'2026-07-15', type:'feedback', title:'фидбек', note:'резервный' },
  { date:'2026-07-15', type:'feedback', title:'финал', finish:true },
];
// =============================================

const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const DOW=['пн','вт','ср','чт','пт','сб','вс'];

const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const key=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const mi=d=>(d.getDay()+6)%7;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const today=new Date();today.setHours(0,0,0,0);

const byDate={};
EVENTS.forEach(e=>{(byDate[key(pd(e.date))] ||= []).push(e)});
const dates=EVENTS.map(e=>pd(e.date)).sort((a,b)=>a-b);
const start=dates[0], end=dates[dates.length-1];
const gridStart=add(start,-mi(start)), gridEnd=add(end,6-mi(end));
const weeks=Math.round((gridEnd-gridStart)/864e5+1)/7;

const fmt=d=>`${d.getDate()} ${MONTHS[d.getMonth()]}`;
const onlineN=EVENTS.filter(e=>e.online).length;
const durWeeks=Math.max(1,Math.ceil((end-start)/(7*864e5)));
document.getElementById('meta').innerHTML=
  `<div class="hl">${fmt(start)} — ${fmt(end)}</div><div>${durWeeks} недель</div><div>${EVENTS.length} событий</div><div>${onlineN} онлайн</div>`;

const span=end-start, elapsed=Math.min(Math.max(today-start,0),span);
const pct=span>0?Math.round(elapsed/span*100):(today>=end?100:0);
const done=EVENTS.filter(e=>pd(e.date)<today).length;
const todayHas=!!byDate[key(today)];
document.getElementById('spineLabel').innerHTML=
  today<start?`старт <b>${fmt(start)}</b> · ещё не начался`
  :today>end?`курс завершён · <b>${EVENTS.length} из ${EVENTS.length}</b>`
  :`пройдено <b>${done} из ${EVENTS.length}</b>${todayHas?' · сегодня есть событие':''}`;
requestAnimationFrame(()=>{
  railFill.style.width=pct+'%';railKnob.style.left=pct+'%';
  const el=document.getElementById('spinePct');let c=0;
  const step=()=>{c+=Math.max(1,Math.ceil((pct-c)/8));if(c>=pct)c=pct;el.innerHTML=c+'<span>%</span>';if(c<pct)requestAnimationFrame(step)};step();
});

const cls=e=>e.finish?'finish':e.type;
function parts(e){
  const type=e.finish?'':(e.type==='lesson'?'урок':'фидбек');
  let extra='';
  if(e.online)extra+=`<span class="lv">онлайн</span>`;
  if(e.note)extra+=`<span class="note">${e.note}</span>`;
  return {type,extra};
}
function chip(e){
  const isDone=pd(e.date)<today;const p=parts(e);
  const row=(p.type||p.extra)?`<div class="chip-type">${p.type} ${p.extra}</div>`:'';
  return `<div class="chip ${cls(e)} ${isDone?'done':''}">${row}<div class="chip-title">${e.title}</div></div>`;
}

let html=`<div class="dow"><span></span>${DOW.map((d,i)=>`<span class="${i>4?'we':''}">${d}</span>`).join('')}</div>`;
let cur=new Date(gridStart);
for(let w=0;w<weeks;w++){
  const a=new Date(cur),b=add(cur,6);
  const range=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MS[b.getMonth()]}`:`${a.getDate()} ${MS[a.getMonth()]} – ${b.getDate()} ${MS[b.getMonth()]}`;
  let cells=`<div class="wk-rail"><span class="wk-num">0${w+1}</span><span class="wk-range">${range}</span></div>`;
  for(let i=0;i<7;i++){
    const d=new Date(cur);const inC=d>=start&&d<=end;const isT=key(d)===key(today);const evs=byDate[key(d)]||[];
    cells+=`<div class="day ${inC?'':'out'} ${isT?'today':''}">
      <div class="daynum"><b>${d.getDate()}</b>${isT?'<span class="today-tag">сегодня</span>':''}</div>
      ${evs.map(chip).join('')}</div>`;
    cur=add(cur,1);
  }
  html+=`<div class="week">${cells}</div>`;
}
document.getElementById('cal').innerHTML=html;

let ag='';cur=new Date(gridStart);
for(let w=0;w<weeks;w++){
  const a=new Date(cur),b=add(cur,6);
  const days=[];
  for(let i=0;i<7;i++){const d=add(cur,i);if(d>=start&&d<=end)days.push(d)}
  if(days.length){
    ag+=`<div class="ag-week"><div class="ag-whead"><span class="n">0${w+1}</span><span class="r">${a.getDate()} ${MS[a.getMonth()]} – ${b.getDate()} ${MS[b.getMonth()]}</span></div>`;
    days.forEach(d=>{
      const isT=key(d)===key(today);const evs=byDate[key(d)]||[];
      if(evs.length){
        evs.forEach(e=>{
          const isDone=pd(e.date)<today,p=parts(e);
          const ty=(p.type||p.extra)?`<div class="ty">${p.type} ${p.extra}</div>`:'';
          ag+=`<div class="ag-item ${cls(e)} ${isDone?'done':''} ${isT?'today':''}">
            <div class="ag-date"><b>${d.getDate()} ${MS[d.getMonth()]}</b>${DOW[mi(d)]}${isT?' · сегодня':''}</div>
            <div class="ag-body"><div class="t">${e.title}</div>${ty}</div></div>`;
        });
      }else{
        const past=d<today;
        ag+=`<div class="ag-empty ${past?'done':''} ${isT?'today':''}">
          <span class="d">${d.getDate()} ${MS[d.getMonth()]}</span><span class="w">${DOW[mi(d)]}</span>${isT?'<span class="today-tag">сегодня</span>':''}</div>`;
      }
    });
    ag+=`</div>`;
  }
  cur=add(cur,7);
}
document.getElementById('agenda').innerHTML=ag;

document.getElementById('foot').innerHTML=`<span class="m">●</span><span>фидбек 3 и 4 — онлайн · урок 5 (9 июля) — дополнительный · 15 июля — резервный фидбек и финал</span>`;
</script>
</body>
</html>
