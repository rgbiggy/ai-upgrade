  :root{
    --bg:#CDCDCD;
    --panel:#D7D7D7;
    --surface:#E6E6E6;
    --hi:#E6E6E6;
    --ink:#000000;
    --ink-30:rgba(0,0,0,.30);
    --ink-20:rgba(0,0,0,.20);
    --ink-12:rgba(0,0,0,.12);
    --ink-08:rgba(0,0,0,.08);
    --accent:#1E42C8;
    --teal:#5FE0A8;
    --teal-ink:#0A4B57;
    --fill:radial-gradient(135% 130% at 26% 20%, #10B9C6 0%, #2A4FD0 100%);
    --fill-lin:linear-gradient(95deg,#10B9C6,#2A4FD0);
    --contour:linear-gradient(30deg,#FFFFFF 0%,#D7D7D7 27%,#D7D7D7 55%,#FFFFFF 100%);
    --font:'Golos',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--font);font-weight:500;line-height:1.42;
    text-transform:lowercase;
    -webkit-font-smoothing:antialiased;
    padding:clamp(20px,4vw,56px);
  }
  b,strong{font-weight:700}
  .wrap{max-width:1080px;margin:0 auto}

  /* ---------- header ---------- */
  .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--ink-30)}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-top:8px}
  .title{font-weight:700;font-size:clamp(46px,9.5vw,104px);line-height:.88;letter-spacing:-.035em}
  .title em{font-style:normal;background:var(--fill);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{text-align:right;font-size:14px;color:var(--ink-30);line-height:1.5}
  .meta .range{color:var(--teal-ink);font-weight:700}

  /* ---------- progress ---------- */
  .spine{margin:30px 0 28px}
  .spine-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:11px}
  .spine-lab{font-size:14px;color:var(--ink-30)}
  .spine-lab b{color:var(--ink)}
  .spine-pct{font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1;letter-spacing:-.03em;
    background:var(--fill-lin);-webkit-background-clip:text;background-clip:text;color:transparent}
  .track{height:6px;border-radius:99px;background:var(--ink-12);overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px;background:var(--fill-lin);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .now{margin-top:12px;font-size:14px;color:var(--ink-30);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .now .dot{width:7px;height:7px;border-radius:99px;background:var(--accent);flex:0 0 auto}
  .now b{color:var(--ink)}

  /* ---------- calendar (desktop) ---------- */
  .shell{background:var(--contour);padding:1px;border-radius:22px}
  .cal{background:var(--bg);border-radius:21px;overflow:hidden}
  .dow{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow span{padding:14px 14px 10px;font-size:12px;color:var(--ink-30);letter-spacing:.04em}
  .week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink-08)}
  .cell{min-height:118px;padding:12px 12px 14px;border-left:1px solid var(--ink-08);display:flex;flex-direction:column;gap:8px}
  .cell:first-child{border-left:0}
  .cell.off{background:rgba(0,0,0,.02)}
  .cell{transition:background .16s ease}
  .cell:hover{background:var(--hi);cursor:default}
  .cell.today,.cell.today:hover{background:var(--hi)}
  .cell.past .num{color:var(--ink-20)}
  .num{font-size:13px;color:var(--ink-30);display:flex;align-items:center;gap:7px}
  .cell.today .num{color:var(--accent);font-weight:700}
  .cell.today .num::after{content:'сегодня';font-size:11px;font-weight:500;letter-spacing:.03em;
    color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 7px 2px}
  .mo{color:var(--ink-20)}

  /* ---------- chips ---------- */
  .chip{border-radius:12px;padding:9px 11px 10px;line-height:1.25;
    display:flex;flex-direction:column;justify-content:flex-start;min-height:62px}
  .chip .k{display:block;font-weight:700;font-size:14px;letter-spacing:-.01em}
  .chip .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px}
  .chip .t{font-size:12px;line-height:1.15;opacity:.88}
  .chip.lesson .t{color:rgba(255,255,255,.92);opacity:1}
  .chip.feedback .t,.chip.qa .t{opacity:.82}
  .chip.lesson{background:var(--fill);color:#fff}
  .chip.feedback{background:var(--teal);color:var(--teal-ink)}
  .chip.done{opacity:.42}
  .chip.qa{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .chip.final{box-shadow:inset 0 0 0 2px var(--teal-ink)}
  .chip .on{display:inline-flex;align-items:center;font-size:10px;font-weight:500;letter-spacing:.04em;
    line-height:1;border:0;border-radius:99px;padding:3px 7px 4px}
  .chip.feedback .on{background:var(--teal-ink);color:var(--teal)}
  .chip.lesson .on{background:rgba(255,255,255,.24);color:#fff}
  .chip.qa .on{background:var(--accent);color:#fff}

  /* ---------- feed (mobile) ---------- */
  .feed{display:none}
  .row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--ink-08);align-items:start}
  .row:first-child{border-top:0}
  .row .d{font-size:13px;color:var(--ink-30);padding-top:2px}
  .row.past .d{color:var(--ink-20)}
  .row.empty{padding:6px 0}
  .row.empty .d{font-size:12px}
  .row.today{position:relative;background:var(--hi);border-radius:14px;
    padding-left:10px;padding-right:10px;margin:0 -10px;border-top-color:transparent}
  .row.today .d{color:var(--accent);font-weight:700}
  .row .stack{display:flex;flex-direction:column;gap:8px}
  .row .today-pill{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 7px 2px;display:inline-block}
  .wk{font-size:11px;letter-spacing:.1em;color:var(--ink-20);padding:18px 0 6px;border-top:1px solid var(--ink-08)}
  .wk:first-child{border-top:0;padding-top:0}

  .foot{margin-top:22px;font-size:13px;color:var(--ink-20)}
  .jump{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:20;border:0;font-family:var(--font);font-weight:700;font-size:14px;
    text-transform:lowercase;color:#fff;background:var(--accent);border-radius:99px;
    padding:12px 20px 13px;box-shadow:0 8px 20px -8px rgba(0,0,0,.55);cursor:pointer}
  .jump:active{transform:translateX(-50%) scale(.97)}

  @media (max-width:860px){
    .shell{display:none}
    .feed{display:block}
    .jump{display:block}
    body{padding-bottom:92px}
    .head{gap:14px}
    .meta{text-align:left}
    .spine{margin:24px 0 22px}
  }
  @media (prefers-reduced-motion:reduce){
    .track i{transition:none}
    .cell{transition:none}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">расписание · поток июль 2026</div>
  <div class="head">
    <h1 class="title"><em>ai</em> upgrade</h1>
    <div class="meta">
      <div class="range">28 июля — 2 сентября</div>
      <div>5 уроков · 5 фидбеков</div>
    </div>
  </div>

  <section class="spine">
    <div class="spine-head">
      <div class="spine-lab">пройдено <b id="done">0</b> из <b id="total">0</b> встреч</div>
      <div class="spine-pct" id="pct">0%</div>
    </div>
    <div class="track"><i id="bar"></i></div>
    <div class="now" id="now"></div>
  </section>

  <div class="shell"><div class="cal" id="cal"></div></div>
  <div class="feed" id="feed"></div>

  <div class="foot">время встреч указано по мск</div>
  <button class="jump" id="jump" type="button">сегодня</button>
</div>

<script>
const START = [2026,6,27];   // пн 27 июля
const WEEKS = 6;

const EVENTS = [
  {date:'2026-07-28', kind:'lesson',   k:'урок 1', t:'старт интенсива'},
  {date:'2026-08-04', kind:'lesson',   k:'урок 2', t:''},
  {date:'2026-08-05', kind:'feedback', k:'фидбек 1', t:''},
  {date:'2026-08-11', kind:'lesson',   k:'урок 3', t:''},
  {date:'2026-08-12', kind:'feedback', k:'фидбек 2', t:''},
  {date:'2026-08-18', kind:'lesson',   k:'урок 4', t:''},
  {date:'2026-08-19', kind:'feedback', k:'фидбек 3', t:'19:00', online:true},
  {date:'2026-08-24', kind:'qa',       k:'q&a', t:'19:00'},
  {date:'2026-08-25', kind:'lesson',   k:'урок 5', t:''},
  {date:'2026-08-26', kind:'feedback', k:'фидбек 4', t:''},
  {date:'2026-09-02', kind:'feedback', k:'фидбек 5', t:'финал · 19:00', final:true, online:true}
];

const DOW = ['пн','вт','ср','чт','пт','сб','вс'];
const MO  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MOS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const byDay = {};
EVENTS.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));

const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const todayKey = key(today);

/* ---- progress ---- */
const done = EVENTS.filter(e => new Date(e.date+'T00:00:00') < today).length;
const pct = Math.round(done / EVENTS.length * 100);
document.getElementById('done').textContent = done;
document.getElementById('total').textContent = EVENTS.length;
document.getElementById('pct').textContent = pct + '%';
requestAnimationFrame(() => document.getElementById('bar').style.width = pct + '%');

const nowEl = document.getElementById('now');
const todayEv = byDay[todayKey];
const next = EVENTS.find(e => new Date(e.date+'T00:00:00') > today);
if (todayEv) {
  nowEl.innerHTML = '<span class="dot"></span>сегодня — <b>' + todayEv.map(e=>e.k).join(' и ') + '</b>';
} else if (next) {
  const d = new Date(next.date+'T00:00:00');
  nowEl.innerHTML = '<span class="dot"></span>дальше — <b>' + next.k + '</b>, ' + d.getDate() + ' ' + MO[d.getMonth()];
} else {
  nowEl.innerHTML = '<span class="dot"></span><b>интенсив завершён</b>';
}

/* ---- chip ---- */
function chip(e, isPast){
  const cls = ['chip', e.kind];
  if (isPast) cls.push('done');
  if (e.final) cls.push('final');
  const meta = (e.online ? '<span class="on">онлайн</span>' : '') + (e.t ? '<span class="t">'+e.t+'</span>' : '');
  return '<span class="'+cls.join(' ')+'"><span class="k">'+e.k+'</span>'+
         (meta ? '<span class="meta">'+meta+'</span>' : '')+'</span>';
}

/* ---- calendar ---- */
const cal = document.getElementById('cal');
let html = '<div class="dow">' + DOW.map(d=>'<span>'+d+'</span>').join('') + '</div>';
const cur = new Date(START[0], START[1], START[2]);
for (let w = 0; w < WEEKS; w++){
  html += '<div class="week">';
  for (let i = 0; i < 7; i++){
    const k = key(cur);
    const evs = byDay[k] || [];
    const isPast = cur < today, isToday = k === todayKey;
    const c = ['cell'];
    if (isPast && !isToday) c.push('past');
    if (isToday) c.push('today');
    if (i > 4 && !evs.length) c.push('off');
    const first = cur.getDate() === 1 || (w === 0 && i === 0);
    html += '<div class="'+c.join(' ')+'"><div class="num"><span>'+cur.getDate()+
            (first ? ' <span class="mo">'+MOS[cur.getMonth()]+'</span>' : '')+'</span></div>'+
            evs.map(e=>chip(e, isPast && !isToday)).join('')+'</div>';
    cur.setDate(cur.getDate()+1);
  }
  html += '</div>';
}
cal.innerHTML = html;

/* ---- mobile feed ---- */
const feed = document.getElementById('feed');
let f = '';
const cur2 = new Date(START[0], START[1], START[2]);
for (let w = 0; w < WEEKS; w++){
  f += '<div class="wk">'+(w < 5 ? 'неделя '+(w+1) : 'финал')+'</div>';
  for (let i = 0; i < 7; i++){
    const k = key(cur2);
    const evs = byDay[k] || [];
    const isPast = cur2 < today, isToday = k === todayKey;
    const c = ['row'];
    if (!evs.length && !isToday) c.push('empty');
    if (isPast && !isToday) c.push('past');
    if (isToday) c.push('today');
    f += '<div class="'+c.join(' ')+'"><div class="d">'+DOW[i]+' '+cur2.getDate()+' '+MOS[cur2.getMonth()]+'</div>'+
         '<div class="stack">'+ (evs.length ? evs.map(e=>chip(e, isPast && !isToday)).join('') : '') +
         (isToday && !evs.length ? '<span class="today-pill">сегодня</span>' : '') + '</div></div>';
    cur2.setDate(cur2.getDate()+1);
  }
}
feed.innerHTML = f;

/* jump to today (mobile) */
document.getElementById('jump').addEventListener('click', () => {
  const t = feed.querySelector('.row.today');
  if (!t) return;
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  t.scrollIntoView({behavior: smooth ? 'smooth' : 'auto', block: 'center'});
});
</script>
</body>
</html>
